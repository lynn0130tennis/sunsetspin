<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Settings - Sunset Spin Invitational</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
</head>
<body>

<div class="profile-container">
    <aside class="profile-sidebar">
        <div class="avatar-container">
            <div class="profile-avatar">🎾</div>
        </div>
        <h2 id="sidebar-username">Loading...</h2>
        <p id="sidebar-email" class="sidebar-subtext">...</p>
        <span class="badge" id="sidebar-usta">USTA --</span>
    </aside>

    <main class="profile-content">
        
        <div class="profile-nav-header" style="margin-bottom: 10px;">
            <a href="index.html" class="btn" style="display: inline-flex; align-items: center; background: #f1f5f9; color: #334155; text-decoration: none; border: 1px solid #cbd5e1; padding: 8px 16px; font-weight: 500;">
                ← Back to Main Page
            </a>
        </div>

        <div id="profile-msg" class="message-banner" style="display: none;"></div>

        <section class="settings-card">
            <h3>Personal Information</h3>
            <p class="section-desc">Update your contact information and tennis profile metrics.</p>
            
            <form id="personal-info-form">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="profile-phone">Phone Number</label>
                        <input type="text" id="profile-phone" placeholder="123-456-7890" maxlength="12">
                    </div>
                    <div class="form-group">
                        <label for="profile-gender">Gender</label>
                        <select id="profile-gender">
                            <option value="">Select Gender</option>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="profile-usta">USTA Rating</label>
                        <select id="profile-usta-select">
                            <option value="">Select Rating</option>
                            <option value="2.5">2.5</option>
                            <option value="3.0">3.0</option>
                            <option value="3.5">3.5</option>
                            <option value="4.0">4.0</option>
                            <option value="4.5">4.5</option>
                            <option value="5.0+">5.0+</option>
                        </select>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary">Save Personal Info</button>
            </form>
        </section>

        <section class="settings-card">
            <h3>Security & Password</h3>
            <p class="section-desc">Change your password to keep your account secure.</p>
            
            <form id="password-change-form">
                <div class="form-group max-w-md">
                    <label for="new-password">New Password</label>
                    <input type="password" id="new-password" placeholder="Minimum 6 characters" required>
                </div>
                <div class="form-group max-w-md">
                    <label for="confirm-password">Confirm New Password</label>
                    <input type="password" id="confirm-password" placeholder="Repeat new password" required>
                </div>
                <button type="submit" class="btn btn-danger">Update Password</button>
            </form>
        </section>
    </main>
</div>

<script src="profile.js" defer></script>
</body>
</html>
